name: Release

# 打 tag(v*) 时自动构建并发布 GitHub Release(安装包 + 更新元数据)。
# 用法:git tag v0.28.0 && git push origin v0.28.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# 发版不可取消在途:同 tag 名重复推送时排队等待,不打断进行中的发版
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # 含 NSIS 打包比 CI 长(打包约 5-10 分钟),40 分钟为正常耗时约 2 倍余量,防挂死占用 runner
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # 版本一致性守卫(审计 ENG-2):tag 名(vX.Y.Z)必须与 package.json version 一致,
      # 不一致 fail fast,防止「版本号三统一」错位(tag/package.json/CHANGELOG,lockfile
      # 为第四源,由发版 checklist 保证同步)。放在 install 之前,失败不浪费安装时间。
      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json version ${PKG_VERSION} 不一致,拒绝发版"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # CI 环境走官方源(GitHub 服务器访问官方源最快;本地 .npmrc 镜像配置不动)
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Typecheck & lint
        run: npm run typecheck && npm run lint

      - name: Acceptance tests
        run: npm run test

      # electron-builder 打包 NSIS 安装包(产物 release/MarkdownToWord-Setup-<版本>.exe + latest.yml)
      - name: Package (NSIS)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 失败兜底:打包半途失败时留存 release/ 已产出物(如部分安装包/日志)供排查,成功时不触发
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: failure-artifacts
          path: release/
          if-no-files-found: ignore
          retention-days: 7

      # 自动生成 Release 并上传安装包与更新元数据。
      # notes 取自 docs/CHANGELOG.md 最新版本条目(发版时人工整理的功能汇总,准确反映本次变更);
      # 提取为空(未写 CHANGELOG)时回退 --generate-notes(commit 列表)。
      # 注意:windows-latest 默认 shell 是 pwsh,本步骤为 bash 语法,必须显式 shell: bash
      - name: Create GitHub Release
        shell: bash
        run: |
          NOTES=$(node -e "
            const fs = require('fs');
            const md = fs.readFileSync('docs/CHANGELOG.md', 'utf8');
            const m = md.match(/## \[[^\]]+\] - [^\n]+\n([\s\S]*?)(?=\n## \[|\$)/);
            process.stdout.write(m ? m[1].trim() : '');
          ")
          # 只上传安装包与更新元数据(builder-debug.yml 为 electron-builder 调试文件,1.0.1 起不再上传)
           # release 标题固定为版本号(tag 名),不再沿用 commit 主题
           TITLE="${{ github.ref_name }}"
           if [ -n "$NOTES" ]; then
             gh release create "${{ github.ref_name }}" release/*.exe release/latest.yml --title "$TITLE" --notes "$NOTES"
           else
             gh release create "${{ github.ref_name }}" release/*.exe release/latest.yml --title "$TITLE" --generate-notes
           fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}