name: Release

# 打 tag(v*) 时自动构建并发布 GitHub Release(安装包 + 更新元数据)。
# 用法:git tag v0.28.0 && git push origin v0.28.0
on:
  push:
    tags:
      - "v*"
  # 兜底/演练入口:必须先 checkout 到目标 tag 再触发(gh workflow run release.yml --ref vX.Y.Z),
  # github.sha 与 ref_name 才指向 tag 提交。
  # - full_verify=true:跳过 CI 复用,跑完整 verify:release(离线/CI 不可用时的退路)
  # - dry_run=true:只验证到打包与清单比对,不创建 Release
  workflow_dispatch:
    inputs:
      full_verify:
        description: 跳过 CI 结论复用，运行完整 verify:release
        required: false
        default: false
        type: boolean
      dry_run:
        description: 只验证到打包与清单比对，不创建 Release
        required: false
        default: true
        type: boolean

permissions:
  contents: write

# 发版不可取消在途:同 tag 名重复推送时排队等待,不打断进行中的发版
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # 发布前只做一件事:确认同一 SHA 的 CI 已经绿。不在 Release 里重跑 verify:ci ——
  # 同一份提交验证一次就够,重复执行既拖长发布又占用 runner。
  # 等待语义:tag 与 master 同步推时 CI 可能尚未创建/仍在跑,本 job 会等;
  # CI 红、被取消、查不到(非 master 提交)一律失败关闭。
  gate:
    if: github.event_name == 'push' || inputs.full_verify != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.wait.outputs.run_id }}
    steps:
      - name: Wait for CI on the same SHA
        id: wait
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # CI run 可能还没创建(两个 workflow 同时排队):先等它出现,最多 2 分钟。
          run_id=""
          for _ in $(seq 1 24); do
            run_id=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=20" \
              --jq '[.workflow_runs[] | select(.head_sha == "'"${SHA}"'")] | sort_by(.created_at) | last | .id // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "::error::找不到 ${SHA} 的 CI run(等待 2 分钟);拒绝在未验证的提交上发布"
            exit 1
          fi
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          # 同 SHA 有多次 run(重跑)时上面已取最新一条;这里只等它完成并判结论。
          for _ in $(seq 1 100); do
            line=$(gh api "repos/${REPO}/actions/runs/${run_id}" --jq '.status + " " + (.conclusion // "-")')
            status=${line%% *}
            conclusion=${line##* }
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "CI ${run_id} success: https://github.com/${REPO}/actions/runs/${run_id}"
                exit 0
              fi
              echo "::error::CI ${run_id} 结论 ${conclusion};先 gh run rerun ${run_id},再重跑本 workflow"
              exit 1
            fi
            sleep 15
          done
          echo "::error::等待 CI ${run_id} 超时(25 分钟)"
          exit 1

  release:
    needs: gate
    if: always() && (needs.gate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.full_verify == true))
    runs-on: windows-latest
    permissions:
      contents: write
      # 下载上游 CI 的 ci-diagnostics(内含 dist 清单)需要 actions: read;
      # 顶层只给了 contents: write,未列出的权限一律 none。
      actions: read
    # 含全量门禁(与 CI 同链)、NSIS 打包与打包后产物核对(清单/ASAR/发布目标)、
    # 约 10-15 分钟,正常约 40-50 分钟;90 分钟为正常耗时的约 2 倍余量,防挂死占用 runner
    timeout-minutes: 90
    steps:
      # 凭据不落盘:actions/checkout 默认把 token 写进 .git/config 供后续 git 命令复用。
      # 本仓脚本没有任何 git 写操作(连只读的 fetch/describe/rev-list 都没有),发版用的
      # 是 gh release create 的 GH_TOKEN 环境变量而非工作区凭据,故关掉持久化不影响
      # 发布;换来的是它不会随诊断 artifact 留存而落到工作区文件里。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # 版本一致性守卫(审计 ENG-2):tag 名(vX.Y.Z)必须与 package.json、package-lock.json
      # 的 version 一致(版本号四源统一,CHANGELOG 由发版 checklist 人工核对),不一致
      # fail fast,防止版本号错位(曾发生 lockfile 漏同步)。放在 install 之前,失败不浪费安装时间。
      - name: Verify tag matches package.json & lockfile version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          LOCK_VERSION=$(node -p "require('./package-lock.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package.json version ${PKG_VERSION} 不一致,拒绝发版"
            exit 1
          fi
          if [ "$TAG_VERSION" != "$LOCK_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 package-lock.json version ${LOCK_VERSION} 不一致,拒绝发版"
            exit 1
          fi

      # 地板版本(engines >=22.13.0)与 ci.yml 主 job 一致:发布环境与门禁环境同 Node 口径
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.13.0
          cache: npm

      # Node 口径与门禁链自检:与依赖安装解耦,版本/命令漂移时在 npm ci 之前即 fail fast
      - name: Check engineering contract
        run: node gates/repo/check-ci-contract.mjs

      # action 引用固定门禁(与 ci.yml 同入口同写法,同样在 npm ci 之前 fail fast):
      # 校验本仓每处 uses: 确为 40 位 commit SHA + 「# vX.Y.Z」版本注释,且
      # SHA/版本与 gates/repo/pinned-actions.baseline.json 一致。固定 SHA 后 Dependabot
      # 漏洞告警失效(版本更新 PR 仍有效),这道门禁是对该代价的补偿面;
      # 纯文本 + JSON 离线可跑,也在 verify:release 链内(经 verify:ci)执行。
      - name: Check action pinning (check:pinned-actions)
        run: npm run check:pinned-actions

      # CI 环境走官方源(GitHub 服务器访问官方源最快;本地 .npmrc 镜像配置不动)
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      # 环境指纹(Node/npm/Electron/Chromium/字体/DPI):与 ci.yml 同入口同写法,
      # 打包/渲染类差异先看指纹再猜;同时写成文件,失败时随诊断 artifact 留存。
      # 探针取不到值时以 unavailable/partial 记入 diagnostics 且不阻断(默认非 --strict)。
      - name: Record environment fingerprint
        shell: bash
        run: |
          mkdir -p output/artifacts
          npm run --silent check:env | tee output/artifacts/env-fingerprint.txt

      # 供应链门禁(独立步骤,不并入 verify:ci/verify:release):SCA 需联网查 advisory 库,
      # 本地链不跑,并进去会让「代码有问题」与「网络抖动」共用一个退出码。放在打包之前 ——
      # 依赖有问题就别浪费时间打安装包。判红口径:生产树漏洞、无声明许可证、SBOM 漂移,
      # 以及扫描源全部不可用(「未能判定」不等于「无漏洞」,不得据此放行)。
      # 与 ci.yml 同一口径:Release 在 GitHub runner 上跑,走官方 registry 拿权威
      # npm advisory;本地仍按项目 .npmrc 国内镜像。扫不到时记 unavailable,不谎报无漏洞。
      - name: Supply chain gate (check:supply)
        run: npm run check:supply -- --registry=https://registry.npmjs.org

      # zizmor 审计(非阻断建议项,与 ci.yml 同一口径与理由):SHA 固定后 Dependabot
      # 漏洞告警失效,zizmor 补这一段(template-injection / excessive-permissions /
      # artipacked / cache-poisoning / known-vulnerable-actions)。本仓现状实跑有既有
      # 发现项(tag 触发的 ref_name 模板展开、contents: write 权限、诊断 artifact),
      # 未逐条评估前不接成硬门禁;硬判定归 check:pinned-actions。
      # 放打包之前:审计是快速只读动作,但「依赖有问题就别浪费时间打安装包」的
      # 排序意图与 check:supply 一致。版本钉死,源与 npm ci 同决策走官方源。
      - name: Advisory actions audit (zizmor, non-blocking)
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          ZIZMOR_VERSION="1.30.1"
          python -m pip install --disable-pip-version-check --quiet "zizmor==${ZIZMOR_VERSION}" \
            || { echo "::warning::zizmor 安装失败(本步骤为非阻断建议项,跳过 action 审计)"; exit 0; }
          ZIZMOR="$(python -c "import os,sysconfig;print(os.path.join(sysconfig.get_path('scripts'),'zizmor.exe'))")"
          if [ ! -x "$ZIZMOR" ]; then ZIZMOR=zizmor; fi
          echo "::notice::zizmor $($ZIZMOR --version) 审计 .github/workflows(非阻断建议项)"
          "$ZIZMOR" --no-progress --format plain .github/workflows
          rc=$?
          echo "::notice::zizmor 退出码 ${rc}(0=无发现;14=有发现;其它=审计器自身出错)。本步骤不阻断发版,发现项须人工评估后处理"
          exit 0

      # 统一门禁入口 + 打包 + 产物核对:verify:release = verify:ci(契约自检/依赖声明
      # 与层向/action 引用固定/build/typecheck/lint/验收段(带覆盖率插桩)/fixture
      # 漂移/smoke/几何门禁)追加 dist,
      # dist 内部先 clean:dist/clean:release(清掉上一版残留与历史安装包)→ build →
      # dist 清单 → electron-builder → 清单校验/ASAR 核对/发布目标核对(含 SHA-256 报告),
      # 复用 ci.yml 同一条链,发布不再维护第二份缩水命令清单,
      # tag 无法绕过 geometry/coverage/fixture/smoke 门禁。
      # 清理只删 dist/ 与 release/ 两个生成目录,路径守卫在 gates/artifacts/clean-artifacts.mjs,
      # 链形态由 gates/repo/check-ci-contract.mjs 断言(勿把清理扩散到其它目录)。
      # electron-builder 打包 NSIS 安装包(产物 release/MarkdownToWord-Setup-<版本>.exe
      # + .blockmap + latest.yml;确切文件名由 package.json build.nsis.artifactName 展开)
      # 默认只打包:验证结论由 gate job 复用的同 SHA CI 提供,dist 内部仍是
      # clean → build → 清单 → electron-builder → 产物核对,与 CI 用同一份构建代码。
      # full_verify=true(兜底/离线演练)才回到 verify:release 全链。
      - name: Package (dist)
        shell: bash
        run: |
          if [ "${{ inputs.full_verify }}" = "true" ]; then
            npm run verify:release
          else
            npm run dist
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 复用结论的可信度锚:CI 已把那次构建的 dist 规范化清单留档,这里取回并与
      # 本次重建的清单逐字节比较。清单含每个文件的路径/大小/SHA-256,一致即证明
      # 重建的 dist 与 CI 验证过的那份相同(不依赖「同一个 SHA 必然产出同样字节」的口头保证)。
      - name: Download CI dist manifest
        if: github.event_name == 'push' || inputs.full_verify != true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ needs.gate.outputs.run_id }}" -n ci-diagnostics -D ci-artifacts

      - name: Compare rebuilt dist with CI manifest
        if: github.event_name == 'push' || inputs.full_verify != true
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const a = fs.readFileSync("ci-artifacts/dist-manifest.json");
            const b = fs.readFileSync("output/artifacts/dist-manifest.json");
            if (!a.equals(b)) {
              console.error("重建的 dist 清单与 CI 留档不一致:同一 SHA 应当产出同样字节");
              process.exit(1);
            }
            console.log("重建的 dist 与 CI 清单逐字节一致");
          '

      # 失败兜底:打包半途失败时留存 release/ 已产出物(如部分安装包/日志)供排查,成功时不触发
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failure-artifacts
          path: release/
          if-no-files-found: ignore
          retention-days: 7

      # 诊断与发布留痕:always 语义保证门禁/打包判红时环境指纹、几何报告与截图、
      # dist 清单、发布产物 SHA-256 报告仍可下载(报告只在全部核对通过后生成)
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-diagnostics
          path: |
            output/artifacts/env-fingerprint.txt
            output/artifacts/ui-geometry/
            output/artifacts/failures/
            output/artifacts/dist-manifest.json
            output/artifacts/release-artifacts.json
          if-no-files-found: ignore
          retention-days: 14

      # 供应链产物留存(独立步骤,不改上面的诊断上传清单):SBOM / 许可证清单 / NOTICE /
      # SCA 报告,供发版留痕与漏洞追溯
      - name: Upload supply artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-artifacts
          path: output/artifacts/supply/
          if-no-files-found: ignore
          retention-days: 14

      # 自动生成 Release 并上传安装包、差分索引与更新元数据。
      # notes 由 gates/repo/release-notes.mjs 抽取,**按 package.json 的版本号定位**
      # `## [<该版本>]` 那一节 —— 不能用「取第一个版本节」:本次版本的条目若尚未写入
      # CHANGELOG(发版纪律允许「本次无用户可感知变化」,此时 [待发版] 天然为空),
      # 正则会落到**上一版**节,Release 页面便显示上一版内容。实测 3.16.2 曾发布出
      # 3.16.1 的条目 —— 那是一句关于本版的错误陈述,比不写更糟。
      # 抽不到对应节即响亮失败(下方已核),不静默回退 --generate-notes(那是 commit 列表)。
      # 资产按当前版本点名上传,不用 release/*.exe 通配:release 是累积目录,
      # 通配会把历史版本的安装包一起发出去,自动更新通道也会拿到错误的最新包。
      # 文件名由 package.json 的 artifactName 模板展开,与 check:release 核对的是同一份产物。
      # 注意:windows-latest 默认 shell 是 pwsh,本步骤为 bash 语法,必须显式 shell: bash
      - name: Create GitHub Release
        if: github.event_name == 'push' || inputs.dry_run != true
        shell: bash
        run: |
          NOTES=$(node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { createRequire } from 'node:module';
            const require_ = createRequire(process.cwd() + '/');
            const pkg = require_('./package.json');
            const { extractNotes } = await import('./gates/repo/release-notes.mjs');
            process.stdout.write(extractNotes(readFileSync('docs/CHANGELOG.md', 'utf8'), pkg.version));
          ")
          INSTALLER=$(node -e 'const p = require("./package.json"); process.stdout.write(p.build.nsis.artifactName.replace("${productName}", p.build.productName).replace("${version}", p.version).replace("${ext}", "exe"))')
          PORTABLE_ZIP=$(node -e 'const p = require("./package.json"); process.stdout.write(p.build.win.artifactName.replace("${productName}", p.build.productName).replace("${version}", p.version).replace("${ext}", "zip"))')
          PORTABLE_7Z=$(node -e 'const p = require("./package.json"); process.stdout.write(p.build.win.artifactName.replace("${productName}", p.build.productName).replace("${version}", p.version).replace("${ext}", "7z"))')
          ASSETS="release/${INSTALLER} release/${INSTALLER}.blockmap release/${PORTABLE_ZIP} release/${PORTABLE_7Z} release/latest.yml"
          for asset in $ASSETS; do
            if [ ! -f "$asset" ]; then
              echo "::error::缺少当前版本发布资产 ${asset}(产物核对应已在 verify:release 拦截,此处兜底)"
              exit 1
            fi
          done
          # 版本四源同源纪律的落地:tag 与 package.json 版本不符时响亮失败,
          # 而不是静默用错版本号发布(发布规则见 PUBLISH-GUIDE.md)。
          PKG_VERSION=$(node -e 'process.stdout.write(require("./package.json").version)')
          if [ "$TAG_NAME" != "v$PKG_VERSION" ]; then
            echo "::error::tag 与 package.json 版本不一致:tag=$TAG_NAME,package.json=v$PKG_VERSION(版本号须四源同源)"
            exit 1
          fi
          # release 标题固定为版本号(tag 名),不再沿用 commit 主题
          TITLE="$TAG_NAME"
          # notes 抽不到 = CHANGELOG 里没有本次版本的条目。这是发版流程漏步(标题行
          # 与正文都没写),不是「本次无变更」—— 后者仍应写一行说明,否则 Release 页面
          # 会是空的。故响亮失败,而不是回退 --generate-notes(那是 commit 列表,
          # 指南已把直接贴 commit 原文列为反模式)。
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md 没有 \`## [$PKG_VERSION]\` 的条目正文,拒绝发布空 notes(若本次确无用户可感知变化,也需写一行说明)"
            exit 1
          fi
          gh release create "$TAG_NAME" $ASSETS --title "$TITLE" --notes "$NOTES"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tag 名只能经环境变量传入,不得直接插值进 shell 脚本体:
          # 直接插值时,含引号/$( ) 的 tag 会被当作 shell 代码解析(zizmor 判 template-injection High)。
          # 触发流是 push tags(需写权限才能建 tag),故利用前提是已有写权限,但仍按注入面消除。
          TAG_NAME: ${{ github.ref_name }}