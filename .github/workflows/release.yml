name: Release

# 打 tag(v*) 时自动构建并发布 GitHub Release(安装包 + 更新元数据)。
# 用法:git tag v0.28.0 && git push origin v0.28.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # CI 环境走官方源(GitHub 服务器访问官方源最快;本地 .npmrc 镜像配置不动)
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Typecheck & lint
        run: npm run typecheck && npm run lint

      - name: Acceptance tests
        run: npm run test

      # electron-builder 打包 NSIS 安装包(产物 release/MarkdownToWord-Setup-<版本>.exe + latest.yml)
      - name: Package (NSIS)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 自动生成 Release 并上传安装包与更新元数据。
      # notes 取自 docs/CHANGELOG.md 最新版本条目(发版时人工整理的功能汇总,准确反映本次变更);
      # 提取为空(未写 CHANGELOG)时回退 --generate-notes(commit 列表)。
      - name: Create GitHub Release
        run: |
          NOTES=$(node -e "
            const fs = require('fs');
            const md = fs.readFileSync('docs/CHANGELOG.md', 'utf8');
            const m = md.match(/## \[[^\]]+\] - [^\n]+\n([\s\S]*?)(?=\n## \[|\$)/);
            process.stdout.write(m ? m[1].trim() : '');
          ")
          if [ -n "$NOTES" ]; then
            gh release create "${{ github.ref_name }}" release/*.exe release/*.yml --notes "$NOTES"
          else
            gh release create "${{ github.ref_name }}" release/*.exe release/*.yml --generate-notes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}