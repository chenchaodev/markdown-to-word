name: CI

# 门禁流水线:push 到 master 或任意分支开 PR 时跑统一验证入口 verify:ci
# (契约自检及其回归 → build → typecheck → lint → acceptance → coverage → fixture 漂移
# → smoke → 几何门禁)。
# 命令清单单源于 package.json scripts,本文件不逐条复述门禁命令(与 release.yml 共用
# 同一 verify:ci 链,发布不维护第二份缩水清单)。
# Node 口径单源于 package.json engines;scripts/check-ci-contract.mjs 断言本文件与
# release.yml 的 node-version 不低于该地板,且至少一处精确钉住地板版本。
on:
  push:
    branches:
      - master
  pull_request:

# 同引用新推送取消在途旧构建(PR 场景避免过时构建排队浪费资源)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest
    # 全流程(install + 契约自检 + build/typecheck/lint + acceptance 段 + coverage 段
    # + fixtures 校验 + smoke + 几何门禁与诊断 artifact 上传)正常约 30-40 分钟;
    # 60 分钟为正常耗时的约 1.5 倍余量,超时即视为挂死快速失败,不占用 runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # 地板版本(engines >=22.13.0)精确钉住:满足当前 ESLint/Electron engine 的最低可复现基线
      - uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: npm

      # Node 口径与门禁链自检:与依赖安装解耦,版本/命令漂移时在 npm ci 之前即 fail fast
      - name: Check engineering contract
        run: node scripts/check-ci-contract.mjs

      # 与 release.yml 同决策:CI 环境走官方源(GitHub 服务器访问官方源最快;本地 .npmrc 镜像配置不动)
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      # 环境指纹(Node/npm/Electron/Chromium/字体/DPI):几何与渲染类失败高度依赖
      # 宿主环境,不落指纹就只能靠猜。同时写成文件,失败时随诊断 artifact 留存。
      # 探针取不到值时以 unavailable/partial 记入 diagnostics 且不阻断(默认非 --strict),
      # 仅脚本本身无法运行时才失败。
      - name: Record environment fingerprint
        shell: bash
        run: |
          mkdir -p output/artifacts
          npm run --silent check:env | tee output/artifacts/env-fingerprint.txt

      # 统一门禁入口:build 必须先于 typecheck(测试树 import dist/ 编译产物)与几何门禁
      # (采样 dist/renderer),顺序与完整性由 scripts/check-ci-contract.mjs 断言守护
      - name: Verify (verify:ci)
        run: npm run verify:ci

      # 诊断留存:always 语义保证门禁判红时报告与截图仍可下载(几何门禁失败时
      # 逐场景 finding 在报告里,FAILED 截图在同目录)
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-diagnostics
          path: |
            output/artifacts/env-fingerprint.txt
            output/artifacts/ui-geometry/
          if-no-files-found: ignore
          retention-days: 7

  # 当前稳定 22.x 兼容 lane(审计 ENG-5:engines 地板由主 job 精确钉住验证,此 lane
  # 覆盖「当前稳定/后续支持版本」也可用,跑 install + build/typecheck/lint + smoke;
  # 不重复全量验收段与 coverage,控制 CI 时长)
  node-lts:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # 主线别名(非精确钉住):跟随 22.x 最新 patch/minor,验证浮动版本也可用
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build & typecheck & lint & smoke on latest Node 22
        run: npm run build && npm run typecheck && npm run lint && npm run test:smoke
