name: CI

# 门禁流水线:push 到 master 或任意分支开 PR 时跑统一验证入口 verify:ci
# (契约自检及其回归 → 依赖声明/层向 → action 引用固定 → build → typecheck → lint
# → acceptance → coverage → fixture 漂移 → smoke → 几何门禁)。
# 命令清单单源于 package.json scripts,本文件不逐条复述门禁命令(与 release.yml 共用
# 同一 verify:ci 链,发布不维护第二份缩水清单)。
# Node 口径单源于 package.json engines;scripts/check-ci-contract.mjs 断言本文件与
# release.yml 的 node-version 不低于该地板,且至少一处精确钉住地板版本。
on:
  push:
    branches:
      - master
  pull_request:

# 最小权限:本 workflow 全程只读仓库 —— checkout 取代码、装依赖、跑门禁、上传诊断
# artifact,没有一步写回 GitHub(不建 PR/评论/发布/改设置)。不显式声明就会继承仓库或
# 组织默认权限(可能含写),一旦某个第三方 action 出事,越权面从一个仓库放大到整个
# 组织,故在此按 job 实际用到的面收窄到 contents: read。
permissions:
  contents: read

# 同引用新推送取消在途旧构建(PR 场景避免过时构建排队浪费资源)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: windows-latest
    # 全流程(install + 契约自检 + build/typecheck/lint + acceptance 段 + coverage 段
    # + fixtures 校验 + smoke + 几何门禁与诊断 artifact 上传)正常约 30-40 分钟;
    # 60 分钟为正常耗时的约 1.5 倍余量,超时即视为挂死快速失败,不占用 runner
    timeout-minutes: 60
    steps:
      # 凭据不落盘:actions/checkout 默认把 token 写进 .git/config 供后续 git 命令复用。
      # 本仓脚本没有任何 git 写操作(连只读的 fetch/describe/rev-list 都没有),token 无处
      # 可用,关掉持久化零代价;换来的是它不会残留在工作区被后面的诊断 artifact 上传带出。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # 地板版本(engines >=22.13.0)精确钉住:满足当前 ESLint/Electron engine 的最低可复现基线
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.13.0
          cache: npm

      # Node 口径与门禁链自检:与依赖安装解耦,版本/命令漂移时在 npm ci 之前即 fail fast
      - name: Check engineering contract
        run: node scripts/check-ci-contract.mjs

      # action 引用固定门禁(与依赖安装解耦,同 fail-fast 口径):本仓 13 处 uses: 全部
      # 固定到 40 位 commit SHA。固定 SHA 的已知代价是 Dependabot 漏洞告警失效
      # (版本更新 PR 仍有效),这道门禁是补偿面 —— 校验每处引用确为 40 位 SHA、
      # 带「# vX.Y.Z」版本注释、且 SHA/版本与 scripts/pinned-actions.baseline.json
      # 登记一致,让「悄悄换掉流水线里跑的 action」必须改基线、经人眼。
      # 纯文本 + JSON,离线可跑(不依赖网络),故也在 verify:ci 链内由
      # scripts/check-ci-contract.mjs 断言其位置(早于 build)。
      - name: Check action pinning (check:pinned-actions)
        run: npm run check:pinned-actions

      # 与 release.yml 同决策:CI 环境走官方源(GitHub 服务器访问官方源最快;本地 .npmrc 镜像配置不动)
      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      # 环境指纹(Node/npm/Electron/Chromium/字体/DPI):几何与渲染类失败高度依赖
      # 宿主环境,不落指纹就只能靠猜。同时写成文件,失败时随诊断 artifact 留存。
      # 探针取不到值时以 unavailable/partial 记入 diagnostics 且不阻断(默认非 --strict),
      # 仅脚本本身无法运行时才失败。
      - name: Record environment fingerprint
        shell: bash
        run: |
          mkdir -p output/artifacts
          npm run --silent check:env | tee output/artifacts/env-fingerprint.txt

      # 统一门禁入口:build 必须先于 typecheck(测试树 import dist/ 编译产物)与几何门禁
      # (采样 dist/renderer),顺序与完整性由 scripts/check-ci-contract.mjs 断言守护
      - name: Verify (verify:ci)
        run: npm run verify:ci

      # zizmor 审计(非阻断建议项,不进 verify:ci 链):GitHub Actions 安全审计器,补
      # SHA 固定后 Dependabot 漏洞告警失效这一段的空白(template-injection /
      # excessive-permissions / artipacked / cache-poisoning / known-vulnerable-actions)。
      # 刻意不阻断:本仓现状经实跑有既有发现项(tag 触发的 ref_name 模板展开、发布 job
      # 的 contents: write 权限、诊断 artifact 上传),未逐条评估前把审计器接成硬门禁
      # 只会天天报红、逼人加 --no-fix 豁免,反而让真问题被噪声淹没。硬判定仍归
      # check:pinned-actions(引用卫生 + 版本基线,exit 非零即阻断)。
      # 源:与 npm ci 同决策,CI 走官方源(GitHub runner 访问官方源最快;本地装工具时
      # 走国内镜像 —— 清华源实测无此包,阿里云源有)。版本钉死(升级须同 PR 复核发现差异)。
      - name: Advisory actions audit (zizmor, non-blocking)
        if: always()
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          ZIZMOR_VERSION="1.30.1"
          python -m pip install --disable-pip-version-check --quiet "zizmor==${ZIZMOR_VERSION}" \
            || { echo "::warning::zizmor 安装失败(本步骤为非阻断建议项,跳过 action 审计)"; exit 0; }
          ZIZMOR="$(python -c "import os,sysconfig;print(os.path.join(sysconfig.get_path('scripts'),'zizmor.exe'))")"
          if [ ! -x "$ZIZMOR" ]; then ZIZMOR=zizmor; fi
          echo "::notice::zizmor $($ZIZMOR --version) 审计 .github/workflows(非阻断建议项)"
          "$ZIZMOR" --no-progress --format plain .github/workflows
          rc=$?
          echo "::notice::zizmor 退出码 ${rc}(0=无发现;14=有发现;其它=审计器自身出错)。本步骤不阻断流水线,发现项须人工评估后处理"
          exit 0

      # 诊断留存:always 语义保证门禁判红时报告与截图仍可下载(几何门禁失败时
      # 逐场景 finding 在报告里,FAILED 截图在同目录)
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-diagnostics
          path: |
            output/artifacts/env-fingerprint.txt
            output/artifacts/ui-geometry/
            output/artifacts/failures/
          if-no-files-found: ignore
          retention-days: 7

  # 供应链门禁(独立 job,不并入本地 verify:ci):SCA 需联网查 advisory 库,
  # npmmirror 的 audit 端点实测未实现、OSV 的可达性也随网络波动,并入本地链会让
  # 「代码有问题」与「网络抖动」共用一个退出码。故只在这里与 Release 里跑,
  # 失败(含扫描源不可用)即判红,阻断本 workflow。
  supply-chain:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # 凭据不落盘:同主 job checkout(本仓无 git 写操作,token 无处可用,且不该被 artifact 带出)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # 地板版本与主 job 一致(lockfile v3 依赖图解析口径)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.13.0

      # 装依赖(经 --ignore-scripts:只要包文件供许可证核对,不跑生命周期脚本,
      # 因此不必下载 electron/sharp 的原生二进制,比主 job 的完整 npm ci 快得多)。
      #
      # 这里曾刻意不装依赖,理由是「SCA 走远端 audit 端点、SBOM 与许可证只读
      # lockfile」——实测该假设不成立,造成两类错误结论(见 scripts/supply 注释):
      #   1. 许可证的物证回落(读 node_modules/<pkg> 里的 LICENSE 文件)在缺包目录时
      #      无从核对,khroma 被判「许可证缺失」而误阻断;
      #   2. 没有依赖树时 `npm audit --omit=dev` 的 dev 剪枝失效,纯构建期工具
      #      (xmldom/fast-uri/js-yaml/sharp)泄漏进生产树 pass 被误判为发布风险。
      # 判定层已改以 lockfile 的 dev 标记为准(不再依赖 pass 口径),但装依赖仍是
      # 许可证物证核对的前提,故此步不可省。
      - name: Install dependencies (no scripts, for license evidence)
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org

      # CI 走官方 registry 拿权威 npm advisory(GitHub runner 访问官方源最快,与本文件
      # 主 job 的 `npm ci --registry=` 同一口径);本地跑仍按项目 .npmrc 国内镜像。
      # 镜像的 audit 端点实测不可用,此时脚本会如实记为 unavailable 并由 OSV 兜底,
      # 绝不把「扫不到」谎报成「无漏洞」。
      - name: Supply chain gate (check:supply)
        run: npm run check:supply -- --registry=https://registry.npmjs.org

      # 诊断留存:SBOM / licenses.json / NOTICE.md / sca-report.json / supply-report.json
      - name: Upload supply artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-artifacts
          path: output/artifacts/supply/
          if-no-files-found: ignore
          retention-days: 14

  # 当前稳定 22.x 兼容 lane(审计 ENG-5:engines 地板由主 job 精确钉住验证,此 lane
  # 覆盖「当前稳定/后续支持版本」也可用,跑 install + build/typecheck/lint + smoke;
  # 不重复全量验收段与 coverage,控制 CI 时长)
  node-lts:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # 凭据不落盘:同主 job checkout(本仓无 git 写操作,token 无处可用,且不该被 artifact 带出)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # 主线别名(非精确钉住):跟随 22.x 最新 patch/minor,验证浮动版本也可用
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build & typecheck & lint & smoke on latest Node 22
        run: npm run build && npm run typecheck && npm run lint && npm run test:smoke
