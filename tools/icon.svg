<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- 印刷付梓 · 朱砂钤印母题(tokens 见 docs/design/ui-guidelines.md 的 acc 色 #B5301C 系) -->
  <defs>
    <!-- 钤印红:上亮下沉的朱砂层次(#C23D1E 深色态 acc → #B5301C 主色 → #97240F acc-h 加深) -->
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c23d1e"/>
      <stop offset=".52" stop-color="#b5301c"/>
      <stop offset="1" stop-color="#97240f"/>
    </linearGradient>
    <!-- 左上柔光:印石受光的微妙体积感 -->
    <radialGradient id="sheen" cx=".28" cy=".18" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 钤印底:Win11 圆角方形铺满画布(沿用原图标足迹 64..960 / rx 210) -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#seal)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#sheen)"/>

  <!-- 内描白环:mockup .tb-seal/.vseal 的 inset 白环(inset 48px ≈ 1.5px@22px 等比,rgba(255,255,255,.3)) -->
  <rect x="112" y="112" width="800" height="800" rx="162" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="18"/>

  <!-- 「梓」:Source Han Serif SC Heavy 字形轮廓(离线提取转 path,不依赖运行时字体);
       视觉高 566px(≈钤印面 63%,对齐 mockup 52~59% 比例),墨迹盒中心对齐画布中心 -->
