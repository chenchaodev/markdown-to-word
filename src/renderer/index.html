<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
    />
    <title>Markdown 转换工具</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <!-- 标题区 -->
      <header class="header">
        <h1 class="title">Markdown 转换工具</h1>
        <p class="subtitle">将 Markdown 文件转换为 Word 或 PDF 文档</p>
      </header>

      <!-- 文件选择区:拖放区 + 选择文件按钮 -->
      <section class="file-area" aria-label="文件选择">
        <div
          id="dropZone"
          class="drop-zone"
          role="button"
          tabindex="0"
          aria-label="点击选择或拖入 Markdown 文件"
          title="点击选择或拖入 Markdown 文件"
        >
          <!-- 默认提示态 -->
          <div id="dropDefault" class="drop-default">
            <svg
              class="drop-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
              <path d="M14 2v6h6" />
            </svg>
            <p class="drop-title">将 Markdown 文件拖到此处</p>
            <p class="drop-or">或</p>
            <button type="button" id="selectBtn" class="btn btn-secondary">
              选择文件
            </button>
          </div>

          <!-- 已选文件态 -->
          <div id="dropFile" class="drop-file hidden">
            <p id="fileName" class="file-name"></p>
            <p id="filePath" class="file-path"></p>
            <p class="drop-change">点击或拖入新文件可更换</p>
          </div>
        </div>
      </section>

      <!-- 状态区:路径 / 错误提示 -->
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <!-- 页面设置:可折叠面板,改动即时生效并自动保存 -->
      <details id="settingsPanel" class="settings">
        <summary class="settings-summary">
          <span class="settings-summary-title">页面设置</span>
          <span class="settings-summary-hint">纸张、边距、分页与导出行为</span>
        </summary>
        <div class="settings-body">
          <div class="settings-grid">
            <div class="setting-field">
              <label class="setting-label" for="paperSelect">纸张</label>
              <select id="paperSelect" class="setting-select">
                <option value="A4">A4</option>
                <option value="A3">A3</option>
                <option value="A5">A5</option>
                <option value="Letter">Letter</option>
                <option value="Legal">Legal</option>
              </select>
            </div>

            <fieldset class="setting-field setting-fieldset">
              <legend class="setting-label">方向</legend>
              <div class="setting-options">
                <label class="setting-option">
                  <input type="radio" name="orientation" value="portrait" />
                  <span>纵向</span>
                </label>
                <label class="setting-option">
                  <input type="radio" name="orientation" value="landscape" />
                  <span>横向</span>
                </label>
              </div>
            </fieldset>

            <fieldset class="setting-field setting-fieldset setting-margins">
              <legend class="setting-label">边距 (mm)</legend>
              <div class="margin-grid">
                <label class="margin-field">
                  <span class="margin-name">上</span>
                  <input type="number" id="marginTop" class="margin-input" min="0" step="0.5" />
                </label>
                <label class="margin-field">
                  <span class="margin-name">下</span>
                  <input type="number" id="marginBottom" class="margin-input" min="0" step="0.5" />
                </label>
                <label class="margin-field">
                  <span class="margin-name">左</span>
                  <input type="number" id="marginLeft" class="margin-input" min="0" step="0.5" />
                </label>
                <label class="margin-field">
                  <span class="margin-name">右</span>
                  <input type="number" id="marginRight" class="margin-input" min="0" step="0.5" />
                </label>
              </div>
            </fieldset>

            <label class="setting-check">
              <input type="checkbox" id="breakBeforeH1" />
              <span>每个一级标题前分页</span>
            </label>

            <fieldset class="setting-field setting-fieldset setting-after">
              <legend class="setting-label">导出后</legend>
              <div class="setting-options">
                <label class="setting-option">
                  <input type="radio" name="afterConvert" value="none" />
                  <span>不执行(仅弹窗提示)</span>
                </label>
                <label class="setting-option">
                  <input type="radio" name="afterConvert" value="show-in-folder" />
                  <span>打开所在文件夹</span>
                </label>
                <label class="setting-option">
                  <input type="radio" name="afterConvert" value="open" />
                  <span>打开文件</span>
                </label>
              </div>
            </fieldset>
          </div>
          <p class="settings-note">设置即时生效并自动保存</p>
        </div>
      </details>

      <!-- 底部操作栏:格式选择 + 转换按钮 -->
      <footer class="actions">
        <fieldset class="formats">
          <legend>输出格式</legend>
          <label class="format-option">
            <input type="radio" name="format" value="docx" checked />
            <span>Word (.docx)</span>
          </label>
          <label class="format-option">
            <input type="radio" name="format" value="pdf" />
            <span>PDF (.pdf)</span>
          </label>
        </fieldset>
        <div class="convert">
          <button type="button" id="convertBtn" class="btn btn-primary" disabled>
            开始转换
          </button>
          <span class="hint">转换功能开发中</span>
        </div>
      </footer>
    </main>

    <!-- 转换完成弹窗(仅成功时弹出;失败保持状态区红字提示) -->
    <div
      id="completeDialog"
      class="dialog-overlay hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="completeDialogTitle"
      aria-describedby="completeDialogDesc"
    >
      <div class="dialog">
        <h2 id="completeDialogTitle" class="dialog-title">转换完成</h2>
        <p id="completeDialogDesc" class="dialog-desc">文档已生成,输出路径如下</p>
        <p id="completeOutputPath" class="dialog-path" tabindex="0"></p>
        <p id="completeDialogError" class="dialog-error hidden" role="alert"></p>
        <div class="dialog-actions">
          <div class="dialog-actions-secondary">
            <button type="button" id="completeDialogPreview" class="btn btn-secondary">
              预览
            </button>
            <button type="button" id="completeDialogReveal" class="btn btn-secondary">
              打开所在文件夹
            </button>
            <button type="button" id="completeDialogOpen" class="btn btn-secondary">
              打开文件
            </button>
          </div>
          <button type="button" id="completeDialogOk" class="btn btn-primary">
            确定
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./renderer.js"></script>
  </body>
</html>
