<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=520, initial-scale=1.0">
  <!-- CSP 与主窗同口径(index.html):脚本全外部('self'),样式含内联块(unsafe-inline),
       页面无 img/字体 url,链接点击经 about.js preventDefault → IPC 外开 -->
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'"
  />
  <title data-i18n="about.aboutTitle"></title>
  <script src="lang-bootstrap.js"></script>
  <style>
    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { overflow: hidden; }

    /* ===== Tokens (scoped under .about-root) =====
     * 值与主窗 base.css §1 令牌表同源(about 窗不引样式表,故在此内联一份;
     * 改色必须两边同改,视觉身份「冷灰纸 + 朱砂」不得分叉)。
     * 覆盖集合 = 本页实际用到的令牌,不得少于用到的:var() 引用完整性
     * 由 test/renderer/ui-contract-guards.test.js 断言。 */
    .about-root {
      color-scheme: light;
      --canvas: #F1F1EE;
      --card: #FBFBF9;
      --card-2: #F3F3EF; /* 步骤序号底 / 特性胶囊底 */
      --ink: #1E2126;
      --ink-2: #494E58;
      --mut: #686D76;
      --line: #E2E2DC;
      --line-2: #CCCDC5; /* 控件描边:版本徽标与链接下划线(与 base.css 同名同值) */
      --acc: #B5301C;
      --acc-ink: #B5301C;
      --acc-h: #982512;
      --acc-soft: rgba(181,48,28,.09);
      --acc-ring: rgba(181,48,28,.30);
      --ok: #2F7D4F; /* 「已是最新」勾 */
      --radius: 10px;
      --solid-bg: #22252B;
      --solid-fg: #FBFBF9;

      --ff-display: "Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, serif;
      --ff-ui: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      --ff-mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;

      --card-w: 420px;
      --seal-size: 76px;
    }

    /* ===== Dark mode =====
     * 双来源,与主窗 base.css 同口径:宿主显式选择优先(显式块写在媒体查询之前,
     * 靠层叠顺序取胜),未显式选择时跟随系统。宿主通道(about.ts / about-preload,
     * 本轮写入范围外)把与主窗同名的 data-theme 写到 <html> 或 .about-root 上时,
     * 本页即刻跟随主窗主题;未接通前仍按系统偏好兜底。 */
    html[data-theme="dark"] .about-root,
    .about-root[data-theme="dark"] {
      color-scheme: dark;
      --canvas: #15181D;
      --card: #1C2027;
      --card-2: #232830;
      --ink: #E9E7E1;
      --ink-2: #B8BCC4;
      --mut: #8B929D;
      --line: #2A2F38;
      --line-2: #3B424E;
      --acc: #C23D1E;
      --acc-ink: #EA6A4A;
      --acc-h: #D5542F;
      --acc-soft: rgba(205,69,38,.16);
      --acc-ring: rgba(205,69,38,.38);
      --ok: #4C9E6D;
      --solid-bg: #E9E7E1;
      --solid-fg: #16181D;
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) .about-root,
      .about-root:not([data-theme="light"]) {
        color-scheme: dark;
        --canvas: #15181D;
        --card: #1C2027;
        --card-2: #232830;
        --ink: #E9E7E1;
        --ink-2: #B8BCC4;
        --mut: #8B929D;
        --line: #2A2F38;
        --line-2: #3B424E;
        --acc: #C23D1E;
        --acc-ink: #EA6A4A;
        --acc-h: #D5542F;
        --acc-soft: rgba(205,69,38,.16);
        --acc-ring: rgba(205,69,38,.38);
        --ok: #4C9E6D;
        --solid-bg: #E9E7E1;
        --solid-fg: #16181D;
      }
    }

    /* ===== Full-window layout ===== */
    .about-root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-family: var(--ff-ui);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Card ===== */
    .about-card {
      position: relative;
      width: var(--card-w);
      min-height: calc(100% - 64px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 34px 38px 30px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      z-index: 1;
    }

    /* ===== Crop marks (四角裁切线) ===== */
    .crop-mark {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      z-index: 2;
    }
    .crop-mark::before,
    .crop-mark::after {
      content: '';
      position: absolute;
      background: var(--mut);
      opacity: 0.35;
    }
    .crop-mark::before { width: 1px; height: 100%; }
    .crop-mark::after { width: 100%; height: 1px; }

    /* Top-left */
    .crop-tl { top: -1px; left: -1px; }
    .crop-tl::before { top: 0; left: 0; }
    .crop-tl::after { top: 0; left: 0; }

    /* Top-right */
    .crop-tr { top: -1px; right: -1px; }
    .crop-tr::before { top: 0; right: 0; }
    .crop-tr::after { top: 0; right: 0; }

    /* Bottom-left */
    .crop-bl { bottom: -1px; left: -1px; }
    .crop-bl::before { bottom: 0; left: 0; }
    .crop-bl::after { bottom: 0; left: 0; }

    /* Bottom-right */
    .crop-br { bottom: -1px; right: -1px; }
    .crop-br::before { bottom: 0; right: 0; }
    .crop-br::after { bottom: 0; right: 0; }

    /* ===== Vermilion seal (钤印) ===== */
    .seal {
      position: absolute;
      bottom: 22px;
      right: -14px;
      width: var(--seal-size);
      height: var(--seal-size);
      background: var(--acc);
      border-radius: 6px;
      transform: rotate(-7deg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      /* stamp-in animation */
      animation: stampIn 420ms cubic-bezier(0.16, 1, 0.3, 1) 280ms both;
    }

    .seal-text {
      font-family: var(--ff-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--card);
      letter-spacing: 0.12em;
      line-height: 1.3;
      transform: rotate(7deg);
      text-align: center;
      user-select: none;
    }

    @keyframes stampIn {
      0% {
        opacity: 0;
        transform: rotate(-7deg) scale(1.18);
      }
      100% {
        opacity: 1;
        transform: rotate(-7deg) scale(1);
      }
    }

    /* 尊重「降低动态效果」:与主窗 base.css 同口径,钤印入场与所有过渡一并关闭 */
    @media (prefers-reduced-motion: reduce) {
      .seal {
        animation: none;
        opacity: 1;
      }

      .about-root *,
      .about-root *::before,
      .about-root *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* ===== Vertical label (直排) ===== */
    .vertical-label {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      font-family: var(--ff-ui);
      font-size: 11px;
      color: var(--mut);
      letter-spacing: 0.18em;
      user-select: none;
      z-index: 2;
      white-space: nowrap;
    }

    /* ===== Card content ===== */
    .about-wordmark {
      font-family: var(--ff-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .about-brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    /* 版本徽标:数据层(mono),描边取控件档 --line-2 与主窗 .tb-ver 对齐,
       使其读作一枚有意为之的数据牌而不是纸面上的浅渍 */
    .about-ver {
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--mut);
      border: 1px solid var(--line-2);
      border-radius: 999px;
      padding: 1px 8px;
      white-space: nowrap;
    }

    .about-subtitle {
      font-family: var(--ff-ui);
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.55;
    }

    .about-divider {
      border: none;
      border-top: 1px solid var(--line);
    }

    /* Meta rows:dl 由 .meta-row 逐行排布(div 作分组壳,HTML5 允许) */
    .about-meta {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 0;
    }

    .meta-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 12.5px;
      line-height: 1.55;
    }

    .meta-label {
      color: var(--mut);
      flex-shrink: 0;
      min-width: 48px;
    }

    .meta-value {
      font-family: var(--ff-mono);
      color: var(--ink-2);
    }

    /* 链接常驻下划线(--line-2):只靠颜色与正文区分,读屏与色觉障碍用户都要
       额外的可识别线索(非仅 hover 才出现的线索);hover 转朱砂。 */
    .meta-value a {
      color: var(--ink-2);
      text-decoration: none;
      border-bottom: 1px solid var(--line-2);
      transition: color 120ms ease, border-color 120ms ease;
    }

    /* 链接悬停:朱砂文字用 --acc-ink(深色下 --acc 仅 3.4:1,不够正文小字) */
    .meta-value a:hover {
      color: var(--acc-ink);
      border-bottom-color: var(--acc);
    }

    /* Focus visible for links and buttons */
    .about-root :focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ===== Quick start ===== */
    /* 章节题:衬线不做正文、层级靠字重 + 三级文字色(guidelines §4.4);
       用 h2 让读屏拿到「快速上手」这一节的结构位置 */
    .about-section-title {
      font-family: var(--ff-ui);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--mut);
      margin-bottom: 8px;
    }

    .about-steps {
      list-style: none;
      counter-reset: step;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0;
      padding: 0;
    }

    .about-steps li {
      counter-increment: step;
      position: relative;
      padding-left: 24px;
      font-size: 12.5px;
      color: var(--ink-2);
      line-height: 1.5;
    }

    .about-steps li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 1px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--card-2);
      color: var(--mut);
      font-family: var(--ff-mono);
      font-size: 10px;
      display: grid;
      place-items: center;
    }

    /* ===== Features ===== */
    .about-features {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .feat-tag {
      font-size: 11px;
      color: var(--ink-2);
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 9px;
      white-space: nowrap;
    }

    /* 离线隐私说明行:胶囊区尾整行,11.5px 弱化说明口径(三级文字色 --mut) */
    .feat-note {
      flex-basis: 100%;
      font-size: 11.5px;
      color: var(--mut);
      line-height: 1.55;
    }

    /* ===== Primary action (neutral; 非付印语义, 不用朱砂) ===== */
    .about-actions {
      margin-top: 0;
    }

    .btn-solid {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      height: 40px;
      background: var(--solid-bg);
      color: var(--solid-fg);
      border: none;
      border-radius: 8px;
      font-family: var(--ff-ui);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 120ms ease;
    }

    .btn-solid:hover {
      filter: brightness(1.12);
    }

    .btn-solid:active {
      filter: brightness(0.96);
    }

    .btn-solid svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ===== Update status row (under version badge) ===== */
    .update-status {
      margin-top: 6px;
      font-size: 11.5px;
      color: var(--mut);
      line-height: 1.5;
    }
    .update-status--checking { color: var(--mut); }
    .update-status--latest { color: var(--ok); }
    .update-status--available { color: var(--ink-2); }
    .update-status--error { color: var(--mut); }
    .update-status .update-retry {
      margin-left: 8px;
      padding: 1px 8px;
      font-size: 11px;
      font-family: var(--ff-ui);
      color: var(--solid-fg);
      background: var(--solid-bg);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: filter 120ms ease;
    }
    .update-status .update-retry:hover { filter: brightness(1.12); }
    .update-status .update-retry:active { filter: brightness(0.96); }
  </style>
</head>
<body>
<div class="about-root">

  <!-- Crop marks -->
  <div class="about-card">
    <div class="crop-mark crop-tl" aria-hidden="true"></div>
    <div class="crop-mark crop-tr" aria-hidden="true"></div>
    <div class="crop-mark crop-bl" aria-hidden="true"></div>
    <div class="crop-mark crop-br" aria-hidden="true"></div>

    <!-- Vertical label -->
    <span class="vertical-label" aria-hidden="true">本地离线 · 真 docx</span>

    <!-- Brand: wordmark + version badge。
         文档大纲:wordmark 是本页唯一的 h1(页面题字,展示衬线只做声音不做正文,
         见 ui-guidelines §1.2),窗口 <title> 是它的文档名;版本号是紧随其后的
         数据层(mono 徽标 + title 说明全称,与主窗标题栏 .tb-ver 同一口径) -->
    <div class="about-brand">
      <h1 class="about-wordmark">MarkdownToWord</h1>
      <span class="about-ver" id="version"></span>
    </div>

    <!-- Update status row (under version badge) -->
    <div class="update-status" id="updateStatus" aria-live="polite">
      <span class="update-text" id="updateText"></span>
      <button class="update-retry" id="updateRetry" type="button" hidden data-i18n="about.checkUpdate"></button>
    </div>
    <hr class="about-divider">

    <!-- Quick start -->
    <div class="about-section">
      <h2 class="about-section-title" data-i18n="about.quickStart"></h2>
      <ol class="about-steps">
        <li data-i18n="about.step1"></li>
        <li data-i18n="about.step2"></li>
        <li data-i18n="about.step3"></li>
      </ol>
    </div>

    <!-- Features -->
    <div class="about-features">
      <span class="feat-tag" data-i18n="about.featOffline"></span>
      <span class="feat-tag" data-i18n="about.featDocx"></span>
      <span class="feat-tag" data-i18n="about.featCjk"></span>
      <span class="feat-tag" data-i18n="about.featBatch"></span>
      <span class="feat-tag" data-i18n="about.featHeader"></span>
      <p class="feat-note" data-i18n="about.privacyNote"></p>
    </div>

    <hr class="about-divider">

    <!-- Meta rows (single repo entry):dl/dt/dd 而非 div 对 div ——
         「标签 → 取值」是定义关系,读屏会成对播报(如「许可证:GPL-3.0」),
         视觉排布仍由 .meta-row 的 flex 基线对齐承担,呈现零变化 -->
    <dl class="about-meta">
      <div class="meta-row">
        <dt class="meta-label" data-i18n="about.author"></dt>
        <dd class="meta-value">
          <a id="authorLink" href="https://github.com/chenchaodev" target="_blank" rel="noopener noreferrer">chenchaodev</a>
        </dd>
      </div>
      <div class="meta-row">
        <dt class="meta-label" data-i18n="about.license"></dt>
        <dd class="meta-value">
          <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer">GPL-3.0</a>
        </dd>
      </div>
      <div class="meta-row">
        <dt class="meta-label" data-i18n="about.repo"></dt>
        <dd class="meta-value">
          <a id="repoLink" href="https://github.com/chenchaodev/markdown-to-word" target="_blank" rel="noopener noreferrer">github.com/chenchaodev/markdown-to-word</a>
        </dd>
      </div>
    </dl>

    <!-- Primary action: user manual -->
    <div class="about-actions">
      <button class="btn-solid" id="aboutOpenBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5z"/>
          <path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v15h5.5c.8 0 1.5-.7 1.5-1.5z"/>
        </svg>
        <span data-i18n="about.manual"></span>
      </button>
    </div>

    <!-- Vermilion seal -->
    <div class="seal" aria-hidden="true">
      <span class="seal-text">排版<br>付梓</span>
    </div>
  </div>

</div>

<script type="module" src="about.js"></script>
</body>
</html>
