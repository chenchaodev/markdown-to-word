<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=520, initial-scale=1.0">
  <title data-i18n="about.aboutTitle"></title>
  <script src="lang-bootstrap.js"></script>
  <style>
    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { overflow: hidden; }

    /* ===== Tokens (scoped under .about-root) ===== */
    .about-root {
      --canvas: #F1F1EE;
      --card: #FBFBF9;
      --ink: #1E2126;
      --ink-2: #494E58;
      --mut: #71767F;
      --line: #E2E2DC;
      --acc: #B5301C;
      --acc-h: #982512;
      --acc-soft: rgba(181,48,28,.09);
      --acc-ring: rgba(181,48,28,.30);
      --radius: 10px;
      --solid-bg: #22252B;
      --solid-fg: #FBFBF9;

      --ff-display: "Source Han Serif SC", "Noto Serif SC", "Songti SC", SimSun, serif;
      --ff-ui: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
      --ff-mono: "Cascadia Code", "JetBrains Mono", Consolas, monospace;

      --card-w: 420px;
      --seal-size: 76px;
    }

    /* ===== Dark mode remap ===== */
    @media (prefers-color-scheme: dark) {
      .about-root {
        --canvas: #15181D;
        --card: #1C2027;
        --ink: #E9E7E1;
        --ink-2: #B8BCC4;
        --mut: #878E99;
        --line: #2A2F38;
        --acc: #C23D1E;
        --acc-h: #D5542F;
        --acc-soft: rgba(205,69,38,.16);
        --acc-ring: rgba(205,69,38,.38);
        --solid-bg: #E9E7E1;
        --solid-fg: #16181D;
      }
    }

    /* ===== Full-window layout ===== */
    .about-root {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--canvas);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      font-family: var(--ff-ui);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Card ===== */
    .about-card {
      position: relative;
      width: var(--card-w);
      min-height: calc(100% - 64px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 34px 38px 30px 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      z-index: 1;
    }

    /* ===== Crop marks (四角裁切线) ===== */
    .crop-mark {
      position: absolute;
      width: 14px;
      height: 14px;
      pointer-events: none;
      z-index: 2;
    }
    .crop-mark::before,
    .crop-mark::after {
      content: '';
      position: absolute;
      background: var(--mut);
      opacity: 0.35;
    }
    .crop-mark::before { width: 1px; height: 100%; }
    .crop-mark::after { width: 100%; height: 1px; }

    /* Top-left */
    .crop-tl { top: -1px; left: -1px; }
    .crop-tl::before { top: 0; left: 0; }
    .crop-tl::after { top: 0; left: 0; }

    /* Top-right */
    .crop-tr { top: -1px; right: -1px; }
    .crop-tr::before { top: 0; right: 0; }
    .crop-tr::after { top: 0; right: 0; }

    /* Bottom-left */
    .crop-bl { bottom: -1px; left: -1px; }
    .crop-bl::before { bottom: 0; left: 0; }
    .crop-bl::after { bottom: 0; left: 0; }

    /* Bottom-right */
    .crop-br { bottom: -1px; right: -1px; }
    .crop-br::before { bottom: 0; right: 0; }
    .crop-br::after { bottom: 0; right: 0; }

    /* ===== Vermilion seal (钤印) ===== */
    .seal {
      position: absolute;
      bottom: 22px;
      right: -14px;
      width: var(--seal-size);
      height: var(--seal-size);
      background: var(--acc);
      border-radius: 6px;
      transform: rotate(-7deg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      /* stamp-in animation */
      animation: stampIn 420ms cubic-bezier(0.16, 1, 0.3, 1) 280ms both;
    }

    .seal-text {
      font-family: var(--ff-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--card);
      letter-spacing: 0.12em;
      line-height: 1.3;
      transform: rotate(7deg);
      text-align: center;
      user-select: none;
    }

    @keyframes stampIn {
      0% {
        opacity: 0;
        transform: rotate(-7deg) scale(1.18);
      }
      100% {
        opacity: 1;
        transform: rotate(-7deg) scale(1);
      }
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .seal {
        animation: none;
        opacity: 1;
      }
    }

    /* ===== Vertical label (直排) ===== */
    .vertical-label {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      font-family: var(--ff-ui);
      font-size: 11px;
      color: var(--mut);
      letter-spacing: 0.18em;
      user-select: none;
      z-index: 2;
      white-space: nowrap;
    }

    /* ===== Card content ===== */
    .about-wordmark {
      font-family: var(--ff-display);
      font-size: 28px;
      font-weight: 700;
      color: var(--ink);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .about-brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .about-ver {
      font-family: var(--ff-mono);
      font-size: 12px;
      color: var(--mut);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 8px;
      white-space: nowrap;
    }

    .about-subtitle {
      font-family: var(--ff-ui);
      font-size: 13px;
      color: var(--ink-2);
      line-height: 1.55;
    }

    .about-divider {
      border: none;
      border-top: 1px solid var(--line);
    }

    /* ===== Meta rows ===== */
    .about-meta {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 0;
    }

    .meta-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-size: 12.5px;
      line-height: 1.55;
    }

    .meta-label {
      color: var(--mut);
      flex-shrink: 0;
      min-width: 48px;
    }

    .meta-value {
      font-family: var(--ff-mono);
      color: var(--ink-2);
    }

    .meta-value a {
      color: var(--ink-2);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 120ms ease, border-color 120ms ease;
    }

    .meta-value a:hover {
      color: var(--acc);
      border-bottom-color: var(--acc);
    }

    /* Focus visible for links and buttons */
    .about-root :focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 2px;
      border-radius: 2px;
    }

    /* ===== Quick start ===== */
    .about-section-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--mut);
      margin-bottom: 8px;
    }

    .about-steps {
      list-style: none;
      counter-reset: step;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 0;
      padding: 0;
    }

    .about-steps li {
      counter-increment: step;
      position: relative;
      padding-left: 24px;
      font-size: 12.5px;
      color: var(--ink-2);
      line-height: 1.5;
    }

    .about-steps li::before {
      content: counter(step);
      position: absolute;
      left: 0;
      top: 1px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--card-2);
      color: var(--mut);
      font-family: var(--ff-mono);
      font-size: 10px;
      display: grid;
      place-items: center;
    }

    /* ===== Features ===== */
    .about-features {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .feat-tag {
      font-size: 11px;
      color: var(--ink-2);
      background: var(--card-2);
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px 9px;
      white-space: nowrap;
    }

    /* ===== Primary action (neutral; 非付印语义, 不用朱砂) ===== */
    .about-actions {
      margin-top: 0;
    }

    .btn-solid {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      height: 40px;
      background: var(--solid-bg);
      color: var(--solid-fg);
      border: none;
      border-radius: 8px;
      font-family: var(--ff-ui);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: filter 120ms ease;
    }

    .btn-solid:hover {
      filter: brightness(1.12);
    }

    .btn-solid:active {
      filter: brightness(0.96);
    }

    .btn-solid svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ===== Update status row (under version badge) ===== */
    .update-status {
      margin-top: 6px;
      font-size: 11.5px;
      color: var(--mut);
      line-height: 1.5;
    }
    .update-status--checking { color: var(--mut); }
    .update-status--latest { color: var(--ok); }
    .update-status--available { color: var(--ink-2); }
    .update-status--error { color: var(--mut); }
    .update-status .update-retry {
      margin-left: 8px;
      padding: 1px 8px;
      font-size: 11px;
      font-family: var(--ff-ui);
      color: var(--solid-fg);
      background: var(--solid-bg);
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: filter 120ms ease;
    }
    .update-status .update-retry:hover { filter: brightness(1.12); }
    .update-status .update-retry:active { filter: brightness(0.96); }
  </style>
</head>
<body>
<div class="about-root">

  <!-- Crop marks -->
  <div class="about-card">
    <div class="crop-mark crop-tl" aria-hidden="true"></div>
    <div class="crop-mark crop-tr" aria-hidden="true"></div>
    <div class="crop-mark crop-bl" aria-hidden="true"></div>
    <div class="crop-mark crop-br" aria-hidden="true"></div>

    <!-- Vertical label -->
    <span class="vertical-label" aria-hidden="true">本地离线 · 真 docx</span>

    <!-- Brand: wordmark + version badge -->
    <div class="about-brand">
      <span class="about-wordmark">MarkdownToWord</span>
      <span class="about-ver" id="version"></span>
    </div>

    <!-- Update status row (under version badge) -->
    <div class="update-status" id="updateStatus" aria-live="polite">
      <button class="update-retry" id="updateRetry" type="button" hidden data-i18n="about.checkUpdate"></button>
    </div>
    <hr class="about-divider">

    <!-- Quick start -->
    <div class="about-section">
      <div class="about-section-title" data-i18n="about.quickStart"></div>
      <ol class="about-steps">
        <li data-i18n="about.step1"></li>
        <li data-i18n="about.step2"></li>
        <li data-i18n="about.step3"></li>
      </ol>
    </div>

    <!-- Features -->
    <div class="about-features">
      <span class="feat-tag" data-i18n="about.featOffline"></span>
      <span class="feat-tag" data-i18n="about.featDocx"></span>
      <span class="feat-tag" data-i18n="about.featCjk"></span>
      <span class="feat-tag" data-i18n="about.featBatch"></span>
      <span class="feat-tag" data-i18n="about.featHeader"></span>
    </div>

    <hr class="about-divider">

    <!-- Meta rows (single repo entry) -->
    <div class="about-meta">
      <div class="meta-row">
        <span class="meta-label" data-i18n="about.author"></span>
        <span class="meta-value">
          <a id="authorLink" href="https://github.com/chenchaodev" target="_blank" rel="noopener noreferrer">chenchaodev</a>
        </span>
      </div>
      <div class="meta-row">
        <span class="meta-label" data-i18n="about.license"></span>
        <span class="meta-value">
          <a href="https://www.gnu.org/licenses/gpl-3.0.html" target="_blank" rel="noopener noreferrer">GPL-3.0</a>
        </span>
      </div>
      <div class="meta-row">
        <span class="meta-label" data-i18n="about.repo"></span>
        <span class="meta-value">
          <a id="repoLink" href="https://github.com/chenchaodev/markdown-to-word" target="_blank" rel="noopener noreferrer">github.com/chenchaodev/markdown-to-word</a>
        </span>
      </div>
    </div>

    <!-- Primary action: user manual -->
    <div class="about-actions">
      <button class="btn-solid" id="aboutOpenBtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v15H5.5C4.7 19 4 18.3 4 17.5z"/>
          <path d="M20 5.5C20 4.7 19.3 4 18.5 4H13v15h5.5c.8 0 1.5-.7 1.5-1.5z"/>
        </svg>
        <span data-i18n="about.manual"></span>
      </button>
    </div>

    <!-- Vermilion seal -->
    <div class="seal" aria-hidden="true">
      <span class="seal-text">排版<br>付梓</span>
    </div>
  </div>

</div>

<script type="module" src="about.js"></script>
</body>
</html>
